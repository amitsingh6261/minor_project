
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Friends Finder</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e0f2fe, #dbeafe, #eef2ff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: white;
            padding: 55px 35px;
            border-radius: 22px;
            text-align: center;
            box-shadow: 0 15px 45px rgba(0, 50, 100, 0.12);
        }

        .logo {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            color: #1d4ed8;
            font-size: 38px;
            margin-bottom: 18px;
        }

        .subtitle {
            color: #475569;
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .features {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin: 25px 0 35px;
        }

        .feature {
            background: #eff6ff;
            color: #1e40af;
            padding: 13px 18px;
            border-radius: 12px;
            font-size: 14px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .btn {
            text-decoration: none;
            padding: 15px 35px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }

        .register {
            background: #2563eb;
            color: white;
        }

        .login {
            background: white;
            color: #2563eb;
            border: 2px solid #2563eb;
        }

        .register:hover {
            background: #1e40af;
        }

        .login:hover {
            background: #eff6ff;
        }

        footer {
            margin-top: 40px;
            color: #94a3b8;
            font-size: 13px;
        }

        @media(max-width: 600px) {
            h1 {
                font-size: 29px;
            }

            .container {
                padding: 40px 20px;
            }

            .subtitle {
                font-size: 16px;
            }

            .buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">🌍</div>

        <h1>Global Friends Finder</h1>

        <p class="subtitle">
            Connect with people around the world,
            make new friends, create groups and
            share your moments together.
        </p>

        <div class="features">
            <div class="feature">👥 Find Friends</div>
            <div class="feature">💬 Private Chat</div>
            <div class="feature">🌐 Group Chat</div>
            <div class="feature">📍 Location Sharing</div>
        </div>

        <div class="buttons">

            <a href="{% url 'register' %}" class="btn register">
                Create Account
            </a>

            <a href="{% url 'login' %}" class="btn login">
                Login
            </a>

        </div>

        <footer>
            © 2026 Global Friends Finder. All Rights Reserved.
        </footer>

    </div>

</body>
</html>
