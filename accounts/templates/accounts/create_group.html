
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Group - Global Friends Finder</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f3f5fb;
            color: #202b45;
            min-height: 100vh;
            padding: 30px 15px;
        }

        .container {
            max-width: 550px;
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

        h1 {
            color: #3563e9;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #7b8498;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 9px;
        }

        input, textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #dce1ec;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
        }

        input:focus, textarea:focus {
            border-color: #3563e9;
        }

        textarea {
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #3563e9;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #244bc0;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #3563e9;
            text-decoration: none;
        }

        .errors {
            color: #b42318;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>➕ Create New Group</h1>

        <p class="subtitle">
            Create a private group and connect with other users.
        </p>

        <form method="POST">

            {% csrf_token %}

            {% if form.errors %}
                <div class="errors">
                    {{ form.errors }}
                </div>
            {% endif %}

            <div class="form-group">
                <label for="{{ form.name.id_for_label }}">
                    Group Name
                </label>

                {{ form.name }}
            </div>

            <div class="form-group">
                <label for="{{ form.description.id_for_label }}">
                    Group Description
                </label>

                {{ form.description }}
            </div>

            <button type="submit">
                Create Group
            </button>

        </form>

        <a href="{% url 'home' %}" class="back-link">
            ← Back to Dashboard
        </a>

    </div>

</body>
</html>
