
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Friends Finder - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #dce8ff, #e9ddff);
            padding: 20px;
        }

        .login-card {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.10);
        }

        .app-icon {
            width: 65px;
            height: 65px;
            background: #e8efff;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            margin: 0 auto 15px;
        }

        .brand {
            text-align: center;
            font-size: 23px;
            font-weight: bold;
            color: #243b70;
        }

        .tagline {
            text-align: center;
            color: #777;
            font-size: 13px;
            margin-top: 7px;
        }

        h2 {
            text-align: center;
            margin-top: 30px;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin: 10px 0 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 12px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #3563e9;
            box-shadow: 0 0 0 3px rgba(53, 99, 233, 0.10);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 65px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            color: #3563e9;
            cursor: pointer;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin: 20px 0;
        }

        a {
            color: #3563e9;
            text-decoration: none;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #3563e9;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #244bc0;
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
        }

        .error-message {
            background: #ffe6e6;
            color: #b42318;
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <div class="app-icon">🌍</div>

        <div class="brand">Global Friends Finder</div>

        <p class="tagline">Connect. Share. Make Friends.</p>

        <h2>Welcome Back!</h2>

        <p class="subtitle">Login to continue your journey</p>

        <form method="POST">
            {% csrf_token %}

            {% if form.errors %}
                <div class="error-message">
                    Invalid username or password.
                </div>
            {% endif %}

            <div class="form-group">
                <label>Username</label>
                {{ form.username }}
            </div>

            <div class="form-group">
                <label>Password</label>

                <div class="password-wrapper">
                    {{ form.password }}

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword()"
                        id="toggleButton">
                        Show
                    </button>
                </div>
            </div>

            <div class="options">
                <label>
                    <input type="checkbox">
                    Remember Me
                </label>

                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <p class="register-link">
            Don't have an account?
            <a href="{% url 'register' %}">Create Account</a>
        </p>

    </div>

    <script>
        function togglePassword() {

            const password = document.getElementById("id_password");
            const button = document.getElementById("toggleButton");

            if (password.type === "password") {
                password.type = "text";
                button.textContent = "Hide";
            } else {
                password.type = "password";
                button.textContent = "Show";
            }
        }
    </script>

</body>
</html>
